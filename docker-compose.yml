services:
  # ============================================================================
  # 1. Database Service: PostgreSQL 16
  # ============================================================================
  database:
    image: postgres:16-alpine
    container_name: inventory-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - inventory-network

  # ============================================================================
  # 2. Backend Service: Java 17 + Spring Boot 3 REST API
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inventory-backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: inventory_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      PORT: 8080
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:80,http://127.0.0.1:3000,http://127.0.0.1:5173
    ports:
      - "8080:8080"
    networks:
      - inventory-network

  # ============================================================================
  # 3. Frontend Service: React (Vite) + Nginx
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080/api
    container_name: inventory-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "3000:80"
    networks:
      - inventory-network

# ==============================================================================
# Persistent Volumes & Custom Network
# ==============================================================================
volumes:
  postgres_data:
    name: inventory_postgres_data

networks:
  inventory-network:
    name: inventory-network
    driver: bridge
